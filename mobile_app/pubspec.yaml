name: sgec_mobile
description: Smart Global Education Consult — student, consultant, and admin app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.2

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # File/image picking for document uploads
  file_picker: 11.0.0
  image_picker: ^1.1.2

  # Digital signature capture for consent forms
  signature: ^5.5.0
  path_provider: ^2.1.3

  # Local persistence for lightweight caching (not for secrets)
  shared_preferences: ^2.2.3

  # i18n / multilingual support
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter

  # Push notifications (Firebase Cloud Messaging) — wire up with your own
  # Firebase project before production; see mobile_app/README.md
  # firebase_core: ^3.3.0
  # firebase_messaging: ^15.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# Generates the real Android launcher icon from assets/icons/app_icon.png.
# Run: flutter pub run flutter_launcher_icons
# This is a placeholder logo (globe + graduation cap) — swap the source
# PNG for real branding whenever it's ready, then re-run the command above.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
